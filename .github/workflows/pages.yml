# Build the site and deploy it to GitHub Pages. Deliberately lean: no tests
# (those run separately in tests.yml and do not block deploys). Node is only
# needed to bundle the CodeMirror editor.
#
# Nothing the site serves from examples/ or wheels/ is stored in the
# repository: the examples and the bilby wheel come from the commit pinned in
# bilby-versions.json, igwn-segments is rebuilt from its sdist, the LALSuite
# wheel is downloaded from the GitLab job pinned in lalsuite-wheel.json, and
# the PyPI wheels pinned in packages.lock.json are served by the site too.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # generated wheels and the bilby clone only change when a pin or a
      # build script changes
      - uses: actions/cache@v4
        with:
          path: |
            wheels
            .cache
          key: site-${{ hashFiles('bilby-versions.json', 'lalsuite-wheel.json', 'packages.lock.json', 'scripts/fetch-bilby.sh', 'scripts/build-igwn-segments.sh') }}

      - name: Build the code editor (CodeMirror)
        run: |
          npm ci
          npm run build:editor

      - name: Build the site
        run: |
          scripts/fetch-bilby.sh
          scripts/build-igwn-segments.sh
          scripts/fetch-lalsuite.sh
          python3 scripts/fetch-pypi-wheels.py
          python3 scripts/make_manifest.py
          python3 scripts/write_wheel_index.py
          python3 scripts/write_sizes.py
          python3 scripts/write_licenses.py

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html licenses.html app.js editor.bundle.js editor.bundle.LICENSE.txt worker.js py assets wheels examples licenses _site/
          # make browsers fetch this deploy's scripts instead of cached ones
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
